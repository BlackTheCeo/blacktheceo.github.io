<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>North Star Bakery - Pre-Order</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .error-msg { color: #c0392b; font-size: 0.85rem; display: block; margin-top: 4px; }
        input { margin-bottom: 5px; padding: 6px; }
    </style>
</head>
<body>
    <header>
        <h1 class="site-title">
            <a href="products.html" style="color: inherit; text-decoration: none;">North Star Bakery</a>
        </h1>
        <nav>
            <a href="index.html">Home</a> |
            <a href="products.html">Menu</a> |
            <a href="contact.html">Pre-Order (<span id="wishlist-badge">0</span>)</a> |
            <a href="about.html">About Us</a>
        </nav>
    </header>

    <main>
        <h2>Pre-Order Request Form</h2>
        <form id="preorder-form" novalidate>
            <fieldset>
                <legend>Pre-Order & Contact Details</legend>

                <label for="cust-name">Full Name *</label><br>
                <input type="text" id="cust-name" name="cust-name"><br>
                <span id="cust-name-error" class="error-msg"></span><br>

                <label for="cust-email">Email Address *</label><br>
                <input type="email" id="cust-email" name="cust-email"><br>
                <span id="cust-email-error" class="error-msg"></span><br>

                <label for="pickup-qty">Total Item Quantity (1-50) *</label><br>
                <input type="number" id="pickup-qty" name="pickup-qty" min="1" max="50"><br>
                <span id="pickup-qty-error" class="error-msg"></span><br>

                <button type="submit">Submit Pre-Order Request</button>
            </fieldset>
        </form>
    </main>

    <!-- External Scripts loaded cleanly at the end of body -->
    <script src="utilities.js"></script>
    <script src="main.js"></script>
</body>
</html>
