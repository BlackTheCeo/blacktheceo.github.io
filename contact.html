<!DOCTYPE html>
<html lang="en">
<head>
<link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>North Star Bakery - Pre-Order</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .error-msg { color: #c0392b; font-size: 0.85rem; display: block; margin-top: 4px; }
        input { margin-bottom: 5px; padding: 6px; }
    </style>
</head>
<body>
    <header>
        <h1 class="site-title">
  <a href="products.html" style="color: inherit; text-decoration: none;">North Star Bakery</a>
</h1>
    </header>

    <main>
        <h2>Pre-Order Request Form</h2>
        <form id="preorder-form" novalidate>
            <fieldset>
                <legend>Pre-Order & Contact Details</legend>

                <label for="cust-name">Full Name *</label><br>
                <input type="text" id="cust-name" name="cust-name"><br>
                <span id="cust-name-error" class="error-msg"></span><br>

                <label for="cust-email">Email Address *</label><br>
                <input type="email" id="cust-email" name="cust-email"><br>
                <span id="cust-email-error" class="error-msg"></span><br>

                <label for="pickup-qty">Total Item Quantity (1-50) *</label><br>
                <input type="number" id="pickup-qty" name="pickup-qty"><br>
                <span id="pickup-qty-error" class="error-msg"></span><br>

                <button type="submit">Submit Pre-Order Request</button>
            </fieldset>
        </form>
    </main>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const storedWishlist = localStorage.getItem("bakeryWishlist");
            if (storedWishlist) {
                const badge = document.getElementById("wishlist-badge");
                if (badge) badge.textContent = JSON.parse(storedWishlist).length;
            }

            const form = document.getElementById("preorder-form");
            form.addEventListener("submit", (e) => {
                e.preventDefault();
                let valid = true;

                const name = document.getElementById("cust-name");
                const email = document.getElementById("cust-email");
                const qty = document.getElementById("pickup-qty");

                if (!name.value.trim()) {
                    document.getElementById("cust-name-error").textContent = "Please enter your full name (at least 2 characters).";
                    name.style.borderColor = "red";
                    valid = false;
                }
                if (!email.value.includes("@")) {
                    document.getElementById("cust-email-error").textContent = "Please enter a valid email address.";
                    email.style.borderColor = "red";
                    valid = false;
                }

                if (valid) {
                    const userData = { name: name.value.trim(), email: email.value.trim() };
                    localStorage.setItem("bakeryUserData", JSON.stringify(userData));
                    alert("Data saved to Local Storage!");
                }
            });
        });
    </script>
</body>
</html>
