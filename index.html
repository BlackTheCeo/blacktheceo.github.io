<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>North Star Bakery - Fresh Neighborhood Artisan Breads & Pastries</title>
    <style>
        /* GLOBAL STYLES */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #FFF8F0; color: #2F2A26; font-family: Arial, Helvetica, sans-serif; font-size: 1rem; line-height: 1.6; }
        img, video, picture { max-width: 100%; height: auto; display: block; border-radius: 6px; }

        /* TYPOGRAPHY */
        h1, h2, h3 { font-family: Georgia, 'Times New Roman', serif; color: #6B3E26; margin-bottom: 0.75rem; }
        h1 { font-size: 2rem; line-height: 1.2; }
        h2 { font-size: 1.5rem; border-bottom: 2px solid #D88C5A; padding-bottom: 0.3rem; margin-top: 1rem; }
        h3 { font-size: 1.2rem; }
        p { margin-bottom: 1rem; }
        a { color: #6B3E26; font-weight: bold; text-decoration: underline; }
        a:hover, a:focus { color: #D88C5A; }

        /* HEADER & NAVIGATION */
        header { background-color: #6B3E26; color: #FFF8F0; padding: 1.5rem 1rem; text-align: center; }
        header img { margin: 0 auto 0.75rem auto; background-color: #FFF8F0; padding: 0.25rem; border-radius: 4px; }
        header h1 { color: #FFF8F0; }
        header p { color: #FFF8F0; font-style: italic; margin-bottom: 1rem; }
        nav ul { list-style: none; display: flex; flex-direction: column; gap: 0.5rem; padding: 0; }
        nav a { display: block; background-color: #D88C5A; color: #2F2A26; text-decoration: none; padding: 0.6rem 1rem; border-radius: 4px; font-weight: bold; text-align: center; transition: background-color 0.2s ease; }
        nav a:hover, nav a:focus { background-color: #FFF8F0; color: #6B3E26; }

        /* MAIN LAYOUT */
        main { padding: 1.5rem 1rem; max-width: 1000px; margin: 0 auto; }
        section { background-color: #ffffff; border: 1px solid #e0d6cb; border-radius: 8px; padding: 1.25rem; margin-bottom: 1.5rem; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        ul { margin-left: 1.25rem; margin-bottom: 1rem; }
        li { margin-bottom: 0.5rem; }
